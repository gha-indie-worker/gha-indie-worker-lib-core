name: build-log-core

on:
  pull_request:
    paths:
      - 'src/build_logs.rs'
      - 'src/lib.rs'
      - '.github/workflows/build-log-core.yml'
  push:
    branches: [main]
    paths:
      - 'src/build_logs.rs'
      - 'src/lib.rs'
      - '.github/workflows/build-log-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-log-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.90.0

      - name: Prove exact revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Default-feature tests
        run: cargo test --all-targets

      - name: Read-only no-default tests
        run: cargo test --all-targets --no-default-features --features read-only
