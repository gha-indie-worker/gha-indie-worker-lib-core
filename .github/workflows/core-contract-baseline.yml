name: Core contract baseline

on:
  pull_request:
    paths:
      - ".github/workflows/core-contract-baseline.yml"
      - "contracts/**"
      - "schema/**"
      - "typespec/**"
      - "proto/**"
      - "wit/**"
      - "dafny/**"
      - ".zpkg.toml"
      - ".zpkg.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/core-contract-baseline.yml"
      - "contracts/**"
      - "schema/**"
      - "typespec/**"
      - "proto/**"
      - "wit/**"
      - "dafny/**"
      - ".zpkg.toml"
      - ".zpkg.lock"
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-contract-baseline:
    uses: ORESoftware/typespec-json-schema-validator/.github/workflows/core-contract-baseline-reusable.yml@5c22eeaf98a6948be5db015ca3c0c18eca4b8147
